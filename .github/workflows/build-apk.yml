name: Build Saavn Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Signed Debug Keystore
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaavnPro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-apk
          name: "Saavn Pro v18 - Jaadu Teri Nazar, Track Time Reset & S24 Ultra Header UI"
          body: "Official Saavn Pro v18 Release:\n- Added 'Jaadu Teri Nazar' (Udit Narayan • Darr) full track with synthesized harmonics\n- Fixed audio track resumption bug: New tracks now cleanly start from 0:00 instead of previous song time\n- S24 Ultra / Mobile Header Layout Optimization: All 5 action icons, room name, avatar, and last seen / online status stay crisp with zero overlap\n- Real Read Receipts (✓, ✓✓, blue ✓✓), last seen tracker, and notification alerts restricted exclusively to 83770"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
