name: Build Saavn Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Signed Debug Keystore
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaavnPro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8-apk
          name: "Saavn Pro v16 - Real Read Receipts, Last Seen, 83770 Alerts & UI Wrapping Fixes"
          body: "Official Saavn Pro v16 Release:\n- Fixed Blue Tick Bug (True read receipts: grey ✓ sent, grey ✓✓ delivered, blue ✓✓ only when chat opened)\n- Notification & Chime Tone exclusive to User 83770\n- Real-time Last Seen & Online presence in chat header\n- Keep mobile keyboard open on Send (No blur on send click)\n- Auto-scroll to latest message on opening chat\n- Fixed reply quote wrapping (no horizontal stretch/scroll)\n- PWA and native Android Capacitor build"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
